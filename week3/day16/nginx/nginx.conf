events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log
        /var/log/nginx/access.log main;

    error_log
        /var/log/nginx/error.log warn;

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    limit_req_zone
        $binary_remote_addr
        zone=api:10m
        rate=10r/s;

    upstream app_servers {
        server app:3000;
    }

    server {
        listen 80;

        server_name localhost;

        add_header
            X-Frame-Options DENY;

        add_header
            X-Content-Type-Options nosniff;

        location /health {
            access_log off;

            proxy_pass
                http://app_servers;

            proxy_set_header
                Host $host;

            proxy_set_header
                X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req
                zone=api
                burst=20
                nodelay;

            proxy_pass
                http://app_servers;

            proxy_set_header
                Host $host;

            proxy_set_header
                X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;

            proxy_connect_timeout 30s;

            proxy_send_timeout 30s;

            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass
                http://app_servers;

            proxy_set_header
                Host $host;

            proxy_set_header
                X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;
        }
    }
}