services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: day16-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

    depends_on:
      mongodb:
        condition: service_healthy

      postgresql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - app_logs:/app/logs

    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "app/healthcheck.js"
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:5.0

    container_name: day16-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: sda_training

    volumes:
      - mongodb_data:/data/db

      - ../scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ]

      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgresql:
    image: postgres:13

    container_name: day16-postgresql

    environment:
      POSTGRES_DB: sda_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    volumes:
      - postgresql_data:/var/lib/postgresql/data

      - ../scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d sda_training"
        ]

      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:6.0-alpine

    container_name: day16-redis

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine

    container_name: day16-nginx

    ports:
      - "8080:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health"
        ]

      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest

    container_name: day16-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=200h"

    restart: unless-stopped

    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest

    container_name: day16-grafana

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

    networks:
      - app-network

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
  app_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge