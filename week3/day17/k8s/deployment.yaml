apiVersion: apps/v1
kind: Deployment
metadata:
  name: sda-training-app
  namespace: sda-training
  labels:
    app: sda-training
    component: app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: sda-training
      component: app

  template:
    metadata:
      labels:
        app: sda-training
        component: app

    spec:
      containers:
        - name: app

          image: sda-training-day16:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: http

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: sda-training-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sda-training-config
                  key: PORT

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sda-training-secrets
                  key: JWT_SECRET

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: sda-training-secrets
                  key: MONGODB_URI

            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: sda-training-secrets
                  key: POSTGRES_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sda-training-secrets
                  key: REDIS_URL

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "300m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      restartPolicy: Always