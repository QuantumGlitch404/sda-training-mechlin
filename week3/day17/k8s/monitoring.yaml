apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sda-training

  labels:
    app: sda-training
    component: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sda-training
      component: monitoring

  template:
    metadata:
      labels:
        app: sda-training
        component: monitoring

    spec:
      containers:
        - name: prometheus

          image: prom/prometheus:latest

          ports:
            - containerPort: 9090
              name: prometheus

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "250m"

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: sda-training

  labels:
    app: sda-training
    component: monitoring

spec:
  type: ClusterIP

  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: prometheus

  selector:
    app: sda-training
    component: monitoring