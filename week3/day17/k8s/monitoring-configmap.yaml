apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sda-training

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: kubernetes-app

        metrics_path: /metrics

        static_configs:
          - targets:
              - sda-training-service.sda-training.svc.cluster.local:3000