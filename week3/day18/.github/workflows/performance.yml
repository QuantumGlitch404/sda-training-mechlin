name: Performance Testing

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: week3/day18/package-lock.json

      - name: Install dependencies
        working-directory: week3/day18
        run: npm ci

      - name: Start Day 16 application
        working-directory: week3/day16
        run: |
          npm ci
          npm start > /tmp/day16-app.log 2>&1 &
          echo $! > /tmp/day16-app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Application is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Application did not become healthy."
          cat /tmp/day16-app.log
          exit 1

      - name: Install Artillery
        run: npm install -g artillery

      - name: Run Artillery load test
        working-directory: week3/day18
        run: artillery run artillery.config.yml

      - name: Run K6 load test
        working-directory: week3/day18
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/scripts" \
            loadimpact/k6 \
            run /scripts/k6-load-test.js

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./week3/day18/lighthouse.config.js"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/day16-app.pid ]; then
            kill "$(cat /tmp/day16-app.pid)" || true
          fi