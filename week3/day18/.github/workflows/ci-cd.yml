name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

env:
  NODE_VERSION: "18"
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgresql:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sda_training_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: week3/day18

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: week3/day18/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/sda_training_test
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sda_training_test
          REDIS_URL: redis://localhost:6379

      - name: Run security audit
        run: npm run security

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day18-test-results
          path: week3/day18/

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Day 16 application image
        uses: docker/build-push-action@v6
        with:
          context: ./week3/day16
          file: ./week3/day16/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes configuration
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "KUBE_CONFIG_STAGING is not configured."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -f week3/day17/k8s/namespace.yaml
          kubectl apply -f week3/day17/k8s/configmap.yaml
          kubectl apply -f week3/day17/k8s/secret.yaml
          kubectl apply -f week3/day17/k8s/deployment.yaml
          kubectl apply -f week3/day17/k8s/service.yaml
          kubectl apply -f week3/day17/k8s/ingress.yaml

      - name: Wait for application
        run: |
          kubectl rollout status deployment/sda-training-app \
            -n sda-training \
            --timeout=180s

      - name: Run smoke tests
        run: |
          kubectl get pods -n sda-training
          kubectl get services -n sda-training
          kubectl get ingress -n sda-training

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes configuration
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "KUBE_CONFIG_PRODUCTION is not configured."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -f week3/day17/k8s/namespace.yaml
          kubectl apply -f week3/day17/k8s/configmap.yaml
          kubectl apply -f week3/day17/k8s/secret.yaml
          kubectl apply -f week3/day17/k8s/deployment.yaml
          kubectl apply -f week3/day17/k8s/service.yaml
          kubectl apply -f week3/day17/k8s/ingress.yaml

      - name: Wait for application
        run: |
          kubectl rollout status deployment/sda-training-app \
            -n sda-training \
            --timeout=180s

      - name: Run production checks
        run: |
          kubectl get pods -n sda-training
          kubectl get services -n sda-training
          kubectl get ingress -n sda-training

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - deploy-staging
      - deploy-production

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure production kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig" >> "$GITHUB_ENV"

      - name: Rollback application
        run: |
          kubectl rollout undo deployment/sda-training-app \
            -n sda-training

          kubectl rollout status deployment/sda-training-app \
            -n sda-training \
            --timeout=180s