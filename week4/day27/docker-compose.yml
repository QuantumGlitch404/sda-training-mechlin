services:
  backend:
    build:
      context: ./backend
    container_name: sda-capstone-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sda-capstone-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
