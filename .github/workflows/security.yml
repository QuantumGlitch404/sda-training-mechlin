name: Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: week3/day16/package-lock.json

      - name: Install Day 16 dependencies
        working-directory: week3/day16
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run npm audit
        working-directory: week3/day16
        run: npm audit --omit=dev

      - name: Run Snyk scan when SNYK_TOKEN is configured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: week3/day16
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is not configured. Skipping optional Snyk scan."
            exit 0
          fi

          npx snyk test --severity-threshold=high
