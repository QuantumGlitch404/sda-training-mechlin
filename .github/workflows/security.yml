name: Day 18 Security Checks

on:
  push:
    branches:
      - develop
      - feature/day18-cicd-pipeline
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          echo "Checking repository for common secret patterns..."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude="security.yml" \
            --exclude="ci-cd.yml" \
            -E "AKIA[0-9A-Z]{16}|BEGIN PRIVATE KEY|ghp_[A-Za-z0-9_]+" \
            .; then
            echo "Potential secret pattern found."
            exit 1
          fi

          echo "No common secret patterns detected."

      - name: Check important security files
        shell: bash
        run: |
          test -f .gitignore
          test -f week3/day18/docs/cicd-guide.md
          echo "Required security-related files are present."

      - name: Check workflow files
        shell: bash
        run: |
          test -d .github/workflows
          find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \)
          echo "Workflow files checked successfully."

      - name: Security validation completed
        run: echo "Day 18 security validation completed successfully."