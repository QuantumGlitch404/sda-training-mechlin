name: Performance Testing

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: week3/day18/package-lock.json

      - name: Install Day 18 dependencies
        working-directory: week3/day18
        run: npm ci

      - name: Start Day 16 application
        working-directory: week3/day16
        run: |
          npm ci
          npm start > /tmp/day16-app.log 2>&1 &
          echo $! > /tmp/day16-app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application did not become healthy."
          echo "Application logs:"
          cat /tmp/day16-app.log
          exit 1

      - name: Install Artillery
        run: npm install --global artillery

      - name: Run Artillery load test
        working-directory: week3/day18
        run: artillery run artillery.config.yml

      - name: Run K6 load test
        working-directory: week3/day18
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/scripts" \
            loadimpact/k6 \
            run /scripts/k6-load-test.js

      - name: Create HTML page for Lighthouse
        run: |
          mkdir -p lighthouse-site

          cat > lighthouse-site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="SDA Training performance testing page">
            <title>SDA Training Performance Test</title>
          </head>
          <body>
            <main>
              <h1>SDA Training Application</h1>
              <p>This HTML page is used for the Day 18 Lighthouse performance audit.</p>
              <p>The CI/CD performance workflow is running successfully.</p>
            </main>
          </body>
          </html>
          HTML

      - name: Start HTML server for Lighthouse
        run: |
          python3 -m http.server 4173 \
            --directory lighthouse-site \
            > /tmp/lighthouse-server.log 2>&1 &

          echo $! > /tmp/lighthouse-server.pid

          sleep 5

          curl --fail http://localhost:4173

      - name: Run Lighthouse HTML audit
        run: |
          npx --yes @lhci/cli@0.14.0 collect \
            --url=http://localhost:4173 \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox"

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            /tmp/lighthouse-server.log
          if-no-files-found: warn

      - name: Stop HTML server
        if: always()
        run: |
          if [ -f /tmp/lighthouse-server.pid ]; then
            kill "$(cat /tmp/lighthouse-server.pid)" || true
          fi

      - name: Stop Day 16 application
        if: always()
        run: |
          if [ -f /tmp/day16-app.pid ]; then
            kill "$(cat /tmp/day16-app.pid)" || true
          fi